name: carousel-render

# يولّد شرائح الكاروسيل تلقائياً عند رفع أو تعديل أي project.json
on:
  push:
    paths:
      - "carousel/projects/**"
      - "carousel/builder.html"
      - "carousel/render.mjs"
      - "carousel/social-doc.mjs"
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - name: Render every project (feed + story + social.docx)
        run: |
          status=0
          for p in carousel/projects/*/project.json; do
            node carousel/render.mjs "$p" || status=$?
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel-slides
          path: carousel/projects/*/out/
