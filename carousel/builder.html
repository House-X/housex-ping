<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOUSE X Carousel Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Poppins:wght@400;600;700;900&family=Tajawal:wght@400;700;900&family=Almarai:wght@400;700;800&family=Noto+Kufi+Arabic:wght@400;700;900&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Raleway:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#26247b;--gold:#ffca05;--red:#ec1c24;--bg:#07101e;--p1:#0f1628;--p2:#152038;--p3:#1a2845;--bdr:#1e3050;--txt:#c8d8f0;--mut:#6a8fb0;--inbg:#1a2d47}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--navy);padding:7px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:2px solid var(--gold);gap:8px}
.logo-text{font-size:14px;font-weight:900;letter-spacing:1px;white-space:nowrap}.logo-text span{color:var(--gold)}
.slide-tabs{display:flex;gap:3px;flex:1;justify-content:center}
.stab{padding:4px 10px;background:rgba(255,255,255,.1);border:1.5px solid transparent;border-radius:5px;cursor:pointer;color:rgba(255,255,255,.55);font-family:'Cairo',sans-serif;font-size:11px;font-weight:700;transition:all .2s;white-space:nowrap}
.stab.active{border-color:var(--gold);background:rgba(255,202,5,.18);color:var(--gold)}
.top-right{display:flex;gap:5px;align-items:center}
.fmt-btn{padding:4px 10px;background:rgba(255,255,255,.1);border:1.5px solid transparent;border-radius:5px;cursor:pointer;color:rgba(255,255,255,.55);font-family:'Cairo',sans-serif;font-size:11px;font-weight:700}
.fmt-btn.active{border-color:var(--red);background:rgba(236,28,36,.18);color:#fff}
.dl-top{background:linear-gradient(135deg,var(--red),#900);border:none;border-radius:5px;padding:5px 14px;color:#fff;font-family:'Cairo',sans-serif;font-size:12px;font-weight:900;cursor:pointer}
.dl-top:disabled{opacity:.5}
.main{flex:1;display:flex;overflow:hidden}
.side{width:225px;background:var(--p1);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.side-r{border-left:1px solid var(--bdr)}.side-l{border-right:1px solid var(--bdr)}
.side-head{padding:6px 10px;background:var(--p2);font-size:9px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.side-body{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.side-body::-webkit-scrollbar{width:3px}.side-body::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.center{flex:1;display:flex;align-items:center;justify-content:center;background:#060d18;overflow:hidden}
.psec{display:flex;flex-direction:column;gap:4px}
.ptitle{font-size:9px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;padding-bottom:3px;border-bottom:1px solid var(--bdr)}
.row{display:flex;align-items:center;gap:4px}
.lbl{font-size:10px;color:var(--txt);min-width:40px;flex-shrink:0}
input[type=range]{flex:1;accent-color:var(--gold);height:3px;cursor:pointer}
.rv{font-size:9px;color:var(--mut);min-width:26px;text-align:left;font-family:'Poppins',sans-serif}
input[type=text]{background:var(--inbg);border:1.5px solid var(--bdr);border-radius:5px;padding:5px 7px;color:#fff;font-family:'Cairo',sans-serif;font-size:11px;outline:none;direction:rtl;width:100%}
input[type=text]:focus{border-color:var(--gold)}
input[type=file]{display:none}
input[type=color]{width:22px;height:22px;border:none;border-radius:3px;cursor:pointer;padding:0;flex-shrink:0}
input[type=number]{background:var(--inbg);border:1.5px solid var(--bdr);border-radius:4px;padding:3px 4px;color:#fff;font-size:10px;outline:none;width:36px;text-align:center;direction:ltr}
select{background:var(--inbg);border:1.5px solid var(--bdr);border-radius:5px;padding:4px 6px;color:#fff;font-family:'Cairo',sans-serif;font-size:10px;outline:none;cursor:pointer;width:100%}
select:focus{border-color:var(--gold)}
.upload-box{border:2px dashed var(--bdr);border-radius:6px;padding:7px;text-align:center;cursor:pointer;color:var(--mut);font-size:10px;font-weight:600;transition:all .2s}
.upload-box:hover{border-color:var(--red)}.upload-box.done{border-color:#2a8a4a;background:#0a180f;color:#5dba80;font-size:9px}
.palette{display:flex;flex-wrap:wrap;gap:2px}
.pchip{width:15px;height:15px;border-radius:2px;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:transform .1s}
.pchip:hover{transform:scale(1.25);border-color:#fff}
.fx-row{display:flex;gap:2px;flex-wrap:wrap}
.fx-btn{padding:3px 7px;background:var(--p3);border:1.5px solid var(--bdr);border-radius:3px;cursor:pointer;color:var(--mut);font-size:10px;font-weight:700;font-family:'Poppins',sans-serif;transition:all .15s}
.fx-btn.on{border-color:var(--gold);color:var(--gold);background:#1e1a00}
.mv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.mv{padding:5px;background:var(--p3);border:1px solid var(--bdr);border-radius:4px;cursor:pointer;color:var(--txt);font-size:13px;text-align:center;user-select:none}
.mv:hover{background:var(--navy);border-color:var(--gold)}.mv:active{background:var(--gold);color:#000}
.align-row{display:flex;gap:3px}
.al-btn{flex:1;padding:4px;background:var(--p3);border:1.5px solid var(--bdr);border-radius:4px;cursor:pointer;color:var(--mut);font-size:10px;font-weight:700;font-family:'Cairo',sans-serif;text-align:center}
.al-btn.on{border-color:var(--gold);color:var(--gold);background:#1e1a00}
.tog-row{display:flex;align-items:center;justify-content:space-between}
.tog{width:28px;height:15px;background:var(--p3);border-radius:8px;cursor:pointer;position:relative;border:1.5px solid var(--bdr)}
.tog.on{background:var(--navy);border-color:var(--gold)}
.tog::after{content:'';width:9px;height:9px;background:#fff;border-radius:50%;position:absolute;top:2px;right:2px;transition:all .2s}
.tog.on::after{right:auto;left:2px}
.sep{height:1px;background:var(--bdr);margin:2px 0}
#slide{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 16px 50px rgba(0,0,0,.9);direction:rtl;background:#ccc;flex-shrink:0}
.s-bg{position:absolute;inset:0;overflow:hidden}
.s-bg-img,.s-col-img{position:absolute;width:100%;height:100%;object-fit:cover;transform-origin:center center;will-change:transform;cursor:grab;touch-action:none}
.s-bg-img:active,.s-col-img:active{cursor:grabbing}
.s-ovl{position:absolute;inset:0;pointer-events:none}
.s-logo{position:absolute;z-index:20;display:none}
.s-logo img{width:100%;height:100%;object-fit:contain;display:block}
.s-collage{position:absolute;z-index:8;overflow:hidden;border-radius:4px}
.s-col-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.s-footer{position:absolute;z-index:20;direction:ltr;display:flex;flex-direction:column}
.s-ftl{font-family:'Cairo',sans-serif;font-weight:700;display:flex;align-items:center;gap:3px}
.s-card{border-radius:8px;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.s-bullet{display:flex;align-items:flex-start;gap:8px}
.s-dot{width:9px;height:9px;min-width:9px;border-radius:50%;background:#ec1c24;margin-top:5px}
.s-loc-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%}
.s-loc-card{border-radius:6px;overflow:hidden;display:flex;flex-direction:row;height:52px}
.s-loc-time{background:#ec1c24;width:38%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;text-align:center;padding:4px;line-height:1.2;font-family:'Cairo',sans-serif}
.s-loc-dest{background:rgba(28,33,88,.9);flex:1;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;text-align:center;padding:4px;line-height:1.3;font-family:'Cairo',sans-serif}
.s-cta-badge{display:inline-block;background:#26247b;color:#ec1c24;padding:2px 10px;border-radius:4px;font-weight:700;font-size:14px;font-family:'Cairo',sans-serif}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo-text">HOUSE<span>X</span></div>
  <div class="slide-tabs">
    <div class="stab active" onclick="goSlide(0)">١ غلاف</div>
    <div class="stab" onclick="goSlide(1)">٢ وحدات</div>
    <div class="stab" onclick="goSlide(2)">٣ موقع</div>
    <div class="stab" onclick="goSlide(3)">٤ مرافق</div>
    <div class="stab" onclick="goSlide(4)">٥ CTA</div>
    <div class="stab" id="aiTab" onclick="goSlide(5)" style="border-color:var(--gold);color:var(--gold);background:rgba(255,202,5,.08)">✨ توليد</div>
  </div>
  <div class="top-right">
    <button class="fmt-btn active" id="btnPost" onclick="setFmt('post')">بوست</button>
    <button class="fmt-btn" id="btnStory" onclick="setFmt('story')">ستوري</button>
    <button class="dl-top" id="dlBtn" onclick="downloadPNG()">⬇ PNG</button>
  </div>
</div>
<div class="main">
  <!-- RIGHT -->
  <div class="side side-r">
    <div class="side-head">الصور والتحريك</div>
    <div class="side-body">
      <div class="psec">
        <div class="ptitle">اللوغو</div>
        <div class="upload-box" id="uLogo" onclick="document.getElementById('inLogo').click()">🏷️ رفع اللوغو</div>
        <input type="file" id="inLogo" accept="image/*">
        <div class="row"><span class="lbl">الحجم</span><input type="range" id="logoSz" min="30" max="130" value="52" oninput="applyLogo()"><span class="rv" id="logoSzV">52</span></div>
      </div>
      <div class="psec">
        <div class="ptitle">الخلفية — اسحب</div>
        <div class="upload-box" id="uBg" onclick="document.getElementById('inBg').click()">🖼️ رفع الخلفية</div>
        <input type="file" id="inBg" accept="image/*">
        <div class="row"><span class="lbl">زووم</span><input type="range" id="bgZ" min="100" max="300" value="100" oninput="applyBgZoom()"><span class="rv" id="bgZv">100%</span></div>
        <div class="mv-grid">
          <div class="mv" onclick="mv('bg','right')">→</div><div class="mv" onclick="mv('bg','up')">↑</div><div class="mv" onclick="mv('bg','left')">←</div>
          <div class="mv" onclick="ctr('bg')">⊙</div><div class="mv" onclick="mv('bg','down')">↓</div><div class="mv" onclick="rst('bg')">↺</div>
        </div>
        <div class="row"><span class="lbl">تظليل</span><input type="range" id="bgOp" min="0" max="95" value="65" oninput="applyOvl()"><span class="rv" id="bgOpV">65%</span><input type="color" id="bgOvCol" value="#ffffff" oninput="applyOvl()"></div>
      </div>
      <div class="psec" id="colPanel">
        <div class="ptitle">الكولاج — اسحب</div>
        <div class="upload-box" id="uCol" onclick="document.getElementById('inCol').click()">📸 رفع الكولاج</div>
        <input type="file" id="inCol" accept="image/*">
        <div class="row"><span class="lbl">زووم</span><input type="range" id="colZ" min="100" max="300" value="100" oninput="applyColZoom()"><span class="rv" id="colZv">100%</span></div>
        <div class="mv-grid">
          <div class="mv" onclick="mv('col','right')">→</div><div class="mv" onclick="mv('col','up')">↑</div><div class="mv" onclick="mv('col','left')">←</div>
          <div class="mv" onclick="ctr('col')">⊙</div><div class="mv" onclick="mv('col','down')">↓</div><div class="mv" onclick="rst('col')">↺</div>
        </div>
        <div class="row"><span class="lbl">تقسيم</span>
          <select id="colLayout" onchange="applyColLayout()">
            <option value="top-two">كبير + صغيرين</option>
            <option value="full">كامل</option>
            <option value="three-h">٣ أفقية</option>
            <option value="three-v">٣ عمودية</option>
            <option value="grid4">شبكة ٢×٢</option>
            <option value="left-big">كبير يسار + ٢</option>
            <option value="right-big">كبير يمين + ٢</option>
          </select>
        </div>
        <div class="row"><span class="lbl">لون الخط</span><input type="color" id="colLineCol" value="#ffffff" oninput="applyColLayout()"><span class="lbl">سُمك</span><input type="number" id="colLineW" value="3" min="0" max="15" oninput="applyColLayout()"></div>
      </div>
    </div>
  </div>
  <!-- CENTER -->
  <div class="center">
    <div id="slide" style="width:378px;height:472px">
      <div class="s-bg">
        <img id="bgImg" class="s-bg-img" src="https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=900&q=80" alt="">
        <div class="s-ovl" id="bgOvl" style="background:rgba(255,255,255,.65)"></div>
      </div>
      <div class="s-logo" id="logoWrap" style="top:8px;left:8px;width:52px;height:26px"><img id="logoImg" src="" alt=""></div>
      <div id="slideContent" style="position:absolute;inset:0;z-index:10"></div>
      <div class="s-footer" id="footer" style="bottom:7px;left:8px;gap:1px">
        <div class="s-ftl" id="ftl1" style="font-size:9px;color:#1a1a3e"><span>📞</span><span id="ftPhone">+90 551 4000 200</span></div>
        <div class="s-ftl" id="ftl2" style="font-size:9px;color:#1a1a3e"><span>🌐</span><span id="ftWeb">www.house-ex.com</span></div>
      </div>
    </div>
  </div>
  <!-- LEFT -->
  <div class="side side-l">
    <div class="side-head">النصوص والإعدادات</div>
    <div class="side-body" id="textPanel"></div>
  </div>
</div>

<script>
// ── CONSTANTS ───────────────────────────────────────
var PAL=['#26247b','#3d3baa','#7977cc','#ffca05','#e6b800','#fff9c4','#ec1c24','#b00014','#ff8a8a','#fff','#f0f0f0','#ccc','#888','#444','#111','#1a1a3e','#0f2a5a','#003322','#2a1a00','#1a0000','#001a2a'];
var FAR=["'Cairo',sans-serif","'Tajawal',sans-serif","'Almarai',sans-serif","'Noto Kufi Arabic',sans-serif","'Amiri',serif","'Scheherazade New',serif"];
var FEN=["'Poppins',sans-serif","'Montserrat',sans-serif","'Raleway',sans-serif","'Playfair Display',serif","'Cairo',sans-serif"];

// ── STATE ───────────────────────────────────────────
var curSlide=0, fmt='post';
var imgSt={bg:{tx:0,ty:0,sc:1},col:{tx:0,ty:0,sc:1}};
var STEP=14;
// persist across navigation
var savedImg={bg:'https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=900&q=80',col:'https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=900&q=80',logo:'',logoShown:false,bgOvl:'rgba(255,255,255,.65)',logoSz:52};
var savedAI={input:'',json:''};
var FT={phone:'+90 551 4000 200',web:'www.house-ex.com',sz:9,col:'#1a1a3e',show:true,align:'left'};

var SD=[
  // 0 Cover
  {tAr:'وادي بريميوم',tEn:'(VADI PREMIUM)',sl1:'اكتشف تجربة معيشة *استثنائية* وسط الطبيعة',sl2:'مع حدائق خاصة وشرفات مطلة على *البحيرة الساحرة*',
   cTAr:'#26247b',cTEn:'#26247b',cSl:'#1a1a3e',cSlAc:'#ec1c24',
   szTAr:30,szTEn:18,szSl:12,
   fTAr:FAR[0],fTEn:FEN[0],fSl:FAR[0],
   fx:{tAr:{bold:true},tEn:{},sl:{}}},
  // 1 Units
  {h:'تحفة معمارية على',hR:'48,200 م²',u1:'١١٦ فيلا فاخرة بإطلالات بانورامية',u2:'دوبلكس *٢+١* بمساحات *١٠٣ م²*',u3:'حدائق خاصة بين *٥٣* و*١٧٤ م²*',cl:'خيار مثالي للخصوصية والهدوء',
   cH:'#2b3280',cHR:'#ec1c24',cU:'#1a1a3e',cCl:'#2b3280',
   szH:26,szU:15,szCl:17,cardOp:45,
   fH:FAR[0],fU:FAR[0],fCl:FAR[0],
   fx:{h:{bold:true},u:{},cl:{}}},
  // 2 Location
  {title:'موقع يربطك بكل ما تحتاج إليه:',t1:'١٥ دقيقة',d1:'لمطار ميلاس بودروم',t2:'١٠ دقائق',d2:'لـ مركز كاريا بورت للتسوق',t3:'٣٠ دقيقة',d3:'لمركز مدينة بودروم',t4:'٤٠ دقيقة',d4:'لمارينا ياليكافاك',cl:'القرب من جميع الخدمات اليومية بين *٢-٥ دقائق*',
   cTitle:'#fff',cCl:'#fff',cClAc:'#ec1c24',
   szTitle:22,szCl:17,titleOp:82,
   fTitle:FAR[0],fCl:FAR[0],
   fx:{title:{bold:true},cl:{}}},
  // 3 Amenities
  {title:'مجتمع متكامل لتجربة منتجعية يومية',
   items:['مسبح رملي بطراز ميامي','مسبح خارجي واسع','صالة رياضية','ساونا + حمام تركي','استديو يوغا وبيلاتس','ملاعب أطفال','مناطق فعاليات وهوايات','بلياردو + تنس طاولة','مواقف سيارات','حراسة ٧/٢٤'],
   cTitle:'#fff',cItem:'#1a1a3e',szTitle:20,szItem:13,titleOp:82,cardOp:50,
   fTitle:FAR[0],fItem:FAR[0],
   fx:{title:{bold:true},item:{}}},
  // 4 CTA
  {nameEn:'VADI PREMIUM',slogan:'حياة فاخرة واستثمار ذكي',desc:'استمتع بتجربة منتجعية يومية وسط الطبيعة الخلابة، مع سكن فاخر وخيارات استثمارية ممتازة',ctaBtn:'تواصل معنا',ctaText:'لمعرفة الأسعار وخيارات الدفع المتاحة',
   cName:'#fff',cSlogan:'#fff',cDesc:'#fff',cCta:'#fff',
   szName:28,szSlogan:20,szDesc:14,szCta:15,descOp:10,
   fName:FEN[0],fSlogan:FAR[0],fDesc:FAR[0],
   fx:{name:{},slogan:{},desc:{},cta:{}}}
];

// ── HELPERS ─────────────────────────────────────────
function g(id){var e=document.getElementById(id);return e?e.value:'';}
function pAc(v,c){return v.replace(/\*([^*]+)\*/g,'<span style="color:'+(c||'#ec1c24')+';font-weight:900">$1</span>');}

function applyFxToEl(el,fxObj,col){
  if(!el||!fxObj)return;
  el.style.fontWeight=fxObj.bold?'900':'700';
  el.style.fontStyle=fxObj.italic?'italic':'normal';
  el.style.textDecoration=fxObj.underline?'underline':'none';
  el.style.textShadow=fxObj.shadow?'2px 2px 8px rgba(0,0,0,.7)':'none';
  el.style.webkitTextStroke=fxObj.stroke?'1px '+(col||'currentColor'):'';
}

// ── PALETTE BUILDER ─────────────────────────────────
function buildPal(id,onPick){
  var c=document.getElementById(id);if(!c)return;
  c.innerHTML='';
  PAL.forEach(function(h){
    var d=document.createElement('div');d.className='pchip';d.style.background=h;
    if(h==='#fff'||h==='#f0f0f0')d.style.outline='1px solid #444';
    d.onclick=function(){onPick(h);};c.appendChild(d);
  });
}

// ── UI GENERATORS ────────────────────────────────────
function mRange(id,mn,mx,val,fn,lbl){
  return '<div class="row"><span class="lbl">'+lbl+'</span><input type="range" id="'+id+'" min="'+mn+'" max="'+mx+'" value="'+val+'" oninput="'+fn+'"><span class="rv" id="'+id+'V">'+val+'</span></div>';
}
function mFont(id,fonts,val,fn){
  var s='<select id="'+id+'" onchange="'+fn+'">';
  fonts.forEach(function(f){s+='<option value="'+f+'"'+(f===val?' selected':'')+'>'+f.split(',')[0].replace(/'/g,'')+'</option>';});
  return s+'</select>';
}
function mPal(palId,colorKey,sdIdx,fn){
  return '<div class="palette" id="'+palId+'"></div><div class="row"><span class="lbl" style="font-size:9px">حر</span><input type="color" id="'+palId+'_cp" value="'+fn+'" oninput="'+colorKey+'=this.value;re'+fn+'()"></div>';
}
function mFxRow(sdIdx,fxKey,reFn){
  var s=SD[sdIdx];var fx=(s.fx&&s.fx[fxKey])||{};
  var lbls={bold:'B',italic:'I',underline:'U',shadow:'ظل',stroke:'حد'};
  return '<div class="fx-row">'+
    ['bold','italic','underline','shadow','stroke'].map(function(f){

  var fullPrompt=PROMPT_TEMPLATE+input.value.trim();

function parseJson(){
  var ta=document.getElementById('aiJson');
  if(!ta||!ta.value.trim()){alert('الرجاء لصق الـ JSON أولاً');return;}
  try{
    var clean=ta.value.replace(/```json|```/g,'').trim();
    var i1=clean.indexOf('{'),i2=clean.lastIndexOf('}');
    if(i1>=0&&i2>=0)clean=clean.slice(i1,i2+1);
    generatedData=JSON.parse(clean);
    showPreview(generatedData);
  }catch(e){alert('خطأ في قراءة الـ JSON — تأكد من نسخه كاملاً:\n'+e.message);}
}

    '<div class="row"><span class="lbl">اللون</span>'+palRow('pal_name')+'<input type="color" id="cp_name" value="'+s.cName+'" oninput="SD[4].cName=this.value;reS4()"></div>'+
    mFxRow(4,'name','reS4')+'</div>'+
  '<div class="psec"><div class="ptitle">السلوجان</div>'+
    '<input type="text" id="i_slogan" value="'+s.slogan+'" oninput="reS4()">'+
    mFont('f_slogan',FAR,s.fSlogan,'reS4()')+
    mRange('sz_slogan',12,32,s.szSlogan,'reS4()','الحجم')+
    '<div class="row"><span class="lbl">اللون</span>'+palRow('pal_slogan')+'<input type="color" id="cp_slogan" value="'+s.cSlogan+'" oninput="SD[4].cSlogan=this.value;reS4()"></div>'+
    mFxRow(4,'slogan','reS4')+'</div>'+
  '<div class="psec"><div class="ptitle">الوصف</div>'+
    '<input type="text" id="i_desc" value="'+s.desc+'" oninput="reS4()">'+
    mFont('f_desc',FAR,s.fDesc,'reS4()')+
    mRange('sz_desc',10,22,s.szDesc,'reS4()','الحجم')+
    '<div class="row"><span class="lbl">اللون</span>'+palRow('pal_desc')+'<input type="color" id="cp_desc" value="'+s.cDesc+'" oninput="SD[4].cDesc=this.value;reS4()"></div>'+
    mFxRow(4,'desc','reS4')+'</div>'+
  '<div class="psec"><div class="ptitle">شفافية الصندوق</div>'+
    mRange('sz_descOp',0,90,s.descOp,'reS4()','شفافية')+'</div>'+
  '<div class="psec"><div class="ptitle">CTA</div>'+
    '<input type="text" id="i_ctaBtn" value="'+s.ctaBtn+'" oninput="reS4()">'+
    '<input type="text" id="i_ctaTxt" value="'+s.ctaText+'" oninput="reS4()" style="margin-top:3px">'+
    mRange('sz_cta',10,22,s.szCta,'reS4()','الحجم')+
    '<div class="row"><span class="lbl">اللون</span>'+palRow('pal_cta')+'<input type="color" id="cp_cta" value="'+s.cCta+'" oninput="SD[4].cCta=this.value;reS4()"></div>'+
    mFxRow(4,'cta','reS4')+'</div>'+ftPanel();
}
function reS4(){
  var s=SD[4];
  s.nameEn=g('i_name');s.slogan=g('i_slogan');s.desc=g('i_desc');s.ctaBtn=g('i_ctaBtn');s.ctaText=g('i_ctaTxt');
  s.fName=g('f_name')||s.fName;s.fSlogan=g('f_slogan')||s.fSlogan;s.fDesc=g('f_desc')||s.fDesc;
  s.szName=+g('sz_name');s.szSlogan=+g('sz_slogan');s.szDesc=+g('sz_desc');s.szCta=+g('sz_cta');s.descOp=+g('sz_descOp');
  sv('sz_name');sv('sz_slogan');sv('sz_desc');sv('sz_cta');sv('sz_descOp','%');
  var e;
  e=document.getElementById('el_name');if(e){e.textContent=s.nameEn;e.style.fontFamily=s.fName;e.style.fontSize=s.szName+'px';e.style.color=s.cName;applyFxToEl(e,s.fx.name,s.cName);}
  e=document.getElementById('el_slogan');if(e){e.textContent=s.slogan;e.style.fontFamily=s.fSlogan;e.style.fontSize=s.szSlogan+'px';e.style.color=s.cSlogan;applyFxToEl(e,s.fx.slogan,s.cSlogan);}
  e=document.getElementById('el_desc');if(e){e.textContent=s.desc;e.style.fontFamily=s.fDesc;e.style.fontSize=s.szDesc+'px';e.style.color=s.cDesc;applyFxToEl(e,s.fx.desc,s.cDesc);}
  e=document.getElementById('el_descBox');if(e)e.style.background='rgba(255,255,255,'+s.descOp/100+')';
  e=document.getElementById('el_ctaBtn');if(e)e.textContent=s.ctaBtn;
  e=document.getElementById('el_ctaTxt');if(e)e.textContent=s.ctaText;
  e=document.getElementById('el_cta');if(e){e.style.fontSize=s.szCta+'px';e.style.color=s.cCta;applyFxToEl(e,s.fx.cta,s.cCta);}
}

// ── SHARED ───────────────────────────────────────────
function sv(id,sfx){var e=document.getElementById(id+'V');if(e)e.textContent=g(id)+(sfx||'');}
function posCollage(){
  var tb=document.getElementById('tb0');var ft=document.getElementById('footer');var cw=document.getElementById('collageWrap');var sl=document.getElementById('slide');
  if(!cw||!tb)return;
  var top=tb.offsetTop+tb.offsetHeight+6;var bot=sl.offsetHeight-(ft.offsetHeight+6);
  cw.style.top=top+'px';cw.style.height=Math.max(bot-top,80)+'px';
}

// ── IMAGE ────────────────────────────────────────────
function applyTr(k){var s=imgSt[k],el=document.getElementById(k==='bg'?'bgImg':'colImg');if(el)el.style.transform='translate('+s.tx+'px,'+s.ty+'px) scale('+s.sc+')';}
function mv(k,d){var s=imgSt[k];if(d==='left')s.tx-=STEP;else if(d==='right')s.tx+=STEP;else if(d==='up')s.ty-=STEP;else s.ty+=STEP;applyTr(k);}
function ctr(k){imgSt[k].tx=0;imgSt[k].ty=0;applyTr(k);}
function rst(k){imgSt[k]={tx:0,ty:0,sc:1};applyTr(k);if(k==='bg'){document.getElementById('bgZ').value=100;document.getElementById('bgZv').textContent='100%';}else{document.getElementById('colZ').value=100;document.getElementById('colZv').textContent='100%';}}
function applyBgZoom(){var z=+document.getElementById('bgZ').value/100;imgSt.bg.sc=z;applyTr('bg');document.getElementById('bgZv').textContent=Math.round(z*100)+'%';}
function applyColZoom(){var z=+document.getElementById('colZ').value/100;imgSt.col.sc=z;applyTr('col');document.getElementById('colZv').textContent=Math.round(z*100)+'%';}
function applyOvl(){var op=+document.getElementById('bgOp').value/100;var col=document.getElementById('bgOvCol').value;var r=parseInt(col.slice(1,3),16),g2=parseInt(col.slice(3,5),16),b=parseInt(col.slice(5,7),16);var bgv='rgba('+r+','+g2+','+b+','+op+')';document.getElementById('bgOvl').style.background=bgv;savedImg.bgOvl=bgv;document.getElementById('bgOpV').textContent=Math.round(op*100)+'%';}
function applyLogo(){var sz=+document.getElementById('logoSz').value;var w=document.getElementById('logoWrap');w.style.width=sz+'px';w.style.height=(sz*.5)+'px';savedImg.logoSz=sz;document.getElementById('logoSzV').textContent=sz;}
function applyColLayout(){var lay=document.getElementById('colLayout').value;var lc=document.getElementById('colLineCol').value;var lw=+document.getElementById('colLineW').value;var svg=document.getElementById('colLines');if(!svg)return;svg.innerHTML='';if(lay==='full'||lw===0)return;function mk(x1,y1,x2,y2){var l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);l.setAttribute('stroke',lc);l.setAttribute('stroke-width',lw);svg.appendChild(l);}if(lay==='top-two'){mk('0','61%','100%','61%');mk('50%','61%','50%','100%');}else if(lay==='three-h'){mk('0','33%','100%','33%');mk('0','67%','100%','67%');}else if(lay==='three-v'){mk('33%','0','33%','100%');mk('67%','0','67%','100%');}else if(lay==='grid4'){mk('0','50%','100%','50%');mk('50%','0','50%','100%');}else if(lay==='left-big'){mk('40%','0','40%','100%');mk('40%','50%','100%','50%');}else if(lay==='right-big'){mk('60%','0','60%','100%');mk('0','50%','60%','50%');}}

function addDrag(imgId,key){
  var el=document.getElementById(imgId);if(!el)return;
  var drag=false,sx,sy,tx0,ty0;
  el.addEventListener('mousedown',function(e){if(e.button!==0)return;drag=true;sx=e.clientX;sy=e.clientY;tx0=imgSt[key].tx;ty0=imgSt[key].ty;el.style.cursor='grabbing';e.preventDefault();});
  document.addEventListener('mousemove',function(e){if(!drag)return;imgSt[key].tx=tx0+(e.clientX-sx);imgSt[key].ty=ty0+(e.clientY-sy);applyTr(key);});
  document.addEventListener('mouseup',function(){if(drag){drag=false;el.style.cursor='grab';}});
  var tx0t,ty0t,tsx,tsy;
  el.addEventListener('touchstart',function(e){var t=e.touches[0];tsx=t.clientX;tsy=t.clientY;tx0t=imgSt[key].tx;ty0t=imgSt[key].ty;e.preventDefault();},{passive:false});
  el.addEventListener('touchmove',function(e){var t=e.touches[0];imgSt[key].tx=tx0t+(t.clientX-tsx);imgSt[key].ty=ty0t+(t.clientY-tsy);applyTr(key);e.preventDefault();},{passive:false});
}

// ── FORMAT ───────────────────────────────────────────
function setFmt(f){fmt=f;var sl=document.getElementById('slide');if(f==='post'){sl.style.width='378px';sl.style.height='472px';}else{sl.style.width='280px';sl.style.height='498px';}document.getElementById('btnPost').className='fmt-btn'+(f==='post'?' active':'');document.getElementById('btnStory').className='fmt-btn'+(f==='story'?' active':'');setTimeout(posCollage,100);}

// ── NAVIGATION ───────────────────────────────────────
var renderers=[renderS0,renderS1,renderS2,renderS3,renderS4,renderS5];
var panels=[panelS0,panelS1,panelS2,panelS3,panelS4,panelS5];
var palBuilders=[
  function(){
    buildPal('pal_tAr',function(h){SD[0].cTAr=h;document.getElementById('el_tAr')&&(document.getElementById('el_tAr').style.color=h);});
    buildPal('pal_tEn',function(h){SD[0].cTEn=h;reS0();});
    buildPal('pal_sl',function(h){SD[0].cSl=h;reS0();});
    buildPal('pal_slAc',function(h){SD[0].cSlAc=h;reS0();});
  },
  function(){
    buildPal('pal_h',function(h){SD[1].cH=h;reS1();});
    buildPal('pal_hR',function(h){SD[1].cHR=h;reS1();});
    buildPal('pal_u',function(h){SD[1].cU=h;reS1();});
    buildPal('pal_cl',function(h){SD[1].cCl=h;reS1();});
  },
  function(){
    buildPal('pal_ttl',function(h){SD[2].cTitle=h;reS2();});
    buildPal('pal_cl2',function(h){SD[2].cCl=h;reS2();});
    buildPal('pal_clAc',function(h){SD[2].cClAc=h;reS2();});
  },
  function(){
    buildPal('pal_ttl3',function(h){SD[3].cTitle=h;reS3();});
    buildPal('pal_item',function(h){SD[3].cItem=h;reS3();});
  },
  function(){
    buildPal('pal_name',  function(h){SD[4].cName=h;   reS4();});
    buildPal('pal_slogan',function(h){SD[4].cSlogan=h;  reS4();});
    buildPal('pal_desc',  function(h){SD[4].cDesc=h;    reS4();});
    buildPal('pal_cta',   function(h){SD[4].cCta=h;     reS4();});
  },
  function(){} // slide 5 — no palettes
];

function goSlide(i){
  // save AI panel fields before leaving slide 5
  if(curSlide===5){
    var ai=document.getElementById('aiInput'),aj=document.getElementById('aiJson');
    if(ai)savedAI.input=ai.value;
    if(aj)savedAI.json=aj.value;
  }
  curSlide=i;
  document.querySelectorAll('.stab').forEach(function(t,j){t.classList.toggle('active',i===j);});
  renderers[i]();
  document.getElementById('textPanel').innerHTML=panels[i]();
  palBuilders[i]();
  // restore bg image + its transform + overlay (all slides)
  var bgEl=document.getElementById('bgImg');
  if(bgEl){bgEl.src=savedImg.bg;}
  var ovl=document.getElementById('bgOvl');
  if(ovl)ovl.style.background=savedImg.bgOvl;
  applyTr('bg');
  // restore logo
  var logoImg=document.getElementById('logoImg'),logoWrap=document.getElementById('logoWrap');
  if(logoImg&&savedImg.logo){logoImg.src=savedImg.logo;}
  if(logoWrap)logoWrap.style.display=savedImg.logoShown?'flex':'none';
  if(logoWrap&&savedImg.logoSz){logoWrap.style.width=savedImg.logoSz+'px';logoWrap.style.height=(savedImg.logoSz*.5)+'px';}
  // restore collage (slide 0 only)
  if(i===0){
    setTimeout(function(){
      var colEl=document.getElementById('colImg');
      if(colEl)colEl.src=savedImg.col;
      addDrag('colImg','col');applyTr('col');
    },80);
  }
  // restore AI fields (slide 5)
  if(i===5){
    var ai=document.getElementById('aiInput'),aj=document.getElementById('aiJson');
    if(ai)ai.value=savedAI.input;
    if(aj)aj.value=savedAI.json;
    if(generatedData)showPreview(generatedData);
  }
}

// ── UPLOADS ──────────────────────────────────────────
function setupUp(inId,imgId,boxId,extra){
  document.getElementById(inId).addEventListener('change',function(){
    var f=this.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(e){var el=document.getElementById(imgId);if(el)el.src=e.target.result;if(extra)extra(e.target.result);var b=document.getElementById(boxId);if(b){b.className='upload-box done';b.textContent='✅ '+f.name;}};
    r.readAsDataURL(f);
  });
}

// ── DOWNLOAD ─────────────────────────────────────────
function downloadPNG(){
  var btn=document.getElementById('dlBtn');btn.textContent='⏳';btn.disabled=true;
  var sl=document.getElementById('slide');
  sl.querySelectorAll('*').forEach(function(el){el.style.animation='none';el.style.transition='none';});
  html2canvas(sl,{scale:2,useCORS:true,allowTaint:true,width:sl.offsetWidth,height:sl.offsetHeight,backgroundColor:null}).then(function(c){
    var url=c.toDataURL('image/png');var a=document.createElement('a');a.href=url;a.download='housex-s'+(curSlide+1)+'-'+fmt+'.png';document.body.appendChild(a);a.click();document.body.removeChild(a);
    btn.textContent='⬇ PNG';btn.disabled=false;
  }).catch(function(e){alert(e.message);btn.textContent='⬇ PNG';btn.disabled=false;});
}

// ── INIT ─────────────────────────────────────────────
window.addEventListener('load',function(){
  setupUp('inLogo','logoImg','uLogo',function(e){savedImg.logo=e;savedImg.logoShown=true;document.getElementById('logoWrap').style.display='flex';});
  setupUp('inBg','bgImg','uBg',function(e){savedImg.bg=e;});
  setupUp('inCol','colImg','uCol',function(e){savedImg.col=e;});
  addDrag('bgImg','bg');
  document.getElementById('bgImg').style.cursor='grab';
  goSlide(0);
});
</script>
